services:
  baucadence:
    build: .
    container_name: baucadence
    ports:
      - "4110:4110"
    volumes:
      - ./data:/etc/koito
    environment:
      # --- Core app ---
      - KOITO_DEFAULT_USERNAME=admin
      - KOITO_DEFAULT_PASSWORD=changeme
      - KOITO_LOGIN_GATE=true

      # --- Credential encryption (required for any source below) ---
      # Generate one with: openssl rand -base64 32
      - SCROBLLI_ENCRYPTION_KEY=CHANGE_ME_RANDOM_SECRET

      # --- Spotify (fill in after creating a Spotify Developer app) ---
      - SCROBLLI_SPOTIFY_CLIENT_ID=
      - SCROBLLI_SPOTIFY_CLIENT_SECRET=
      - SCROBLLI_SPOTIFY_REDIRECT_URI=https://your-domain.example/apis/sources/v1/spotify/callback

      # --- Jellyfin (fill in a secret of your choosing) ---
      - SCROBLLI_JELLYFIN_WEBHOOK_SECRET=

      # --- YouTube / YouTube Music (cookie is entered in the app's Settings > Sources tab, not here) ---
      - SCROBLLI_YTMUSIC_ENABLED=true
      - SCROBLLI_YTMUSIC_TRACK_VIDEOS=false

      # --- YouTube Data API key (optional; free, from console.cloud.google.com,
      # enable "YouTube Data API v3", create an API key - no OAuth needed).
      # Used only to classify regular YouTube videos found in a Google Takeout
      # watch-history import: Music-category videos are counted as listens,
      # everything else goes to the separate Videos tab. Without this key,
      # SCROBLLI_YTMUSIC_TRACK_VIDEOS above is the fallback (all-or-nothing). ---
      - SCROBLLI_YOUTUBE_DATA_API_KEY=

      # --- LastFM (optional; enables artist/album art fallback and the homepage
      # mood insight card). Get a free key at last.fm/api/account/create ---
      - KOITO_LASTFM_API_KEY=
    restart: unless-stopped
